name: Build PS3 Homebrew

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Gerar ícone
        run: |
          if [ -f tools/make_icon.py ]; then
            python3 tools/make_icon.py
          fi

      - name: Compilar SELF e PKG
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build \
            hldtux/ps3dev:latest \
            bash -lc "make && make pkg"

      - name: Conferir arquivos gerados
        run: |
          find . -type f \( -name "*.self" -o -name "*.pkg" \)
          test -n "$(find . -type f -name '*.self' -print -quit)"
          test -n "$(find . -type f -name '*.pkg' -print -quit)"

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Homebrew
          path: |
            **/*.self
            **/*.pkg
          if-no-files-found: error
