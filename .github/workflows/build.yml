name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: cobra-arena
          path: |
            *.self
            *.pkg